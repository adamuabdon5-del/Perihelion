name: Dependency audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "contracts/soroban/Cargo.toml"
      - "contracts/soroban/Cargo.lock"
      - "deny.toml"
      - ".github/dependency-audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/check-npm-audit.mjs"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "sdk/**"
      - "relayer/**"
      - "solver/**"
      - "mempool/**"
      - "test/**"
      - "contracts/soroban/Cargo.toml"
      - "contracts/soroban/Cargo.lock"
      - "deny.toml"
      - ".github/dependency-audit-allowlist.json"
      - ".github/workflows/dependency-audit.yml"
      - "scripts/check-npm-audit.mjs"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs only check out and run audit tools.
permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --json --audit-level=high > npm-audit.json || true
          node scripts/check-npm-audit.mjs npm-audit.json .github/dependency-audit-allowlist.json

  cargo-audit:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # master (pinned)
        with:
          toolchain: 1.85.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "0.20.2"

      - name: Run cargo-deny (advisories, licences, bans, sources)
        run: cargo deny --manifest-path contracts/soroban/Cargo.toml --config deny.toml check advisories licenses bans sources
